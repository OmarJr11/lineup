services:
  db:
    image: postgres:18
    restart: always
    # Solo localhost del VPS (para túnel SSH / DBeaver). No exponer a internet.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:8
    restart: always
    volumes:
      - redis_data:/data

  api-users:
    build: .
    container_name: api-users
    command: ["node", "dist/users/apps/users/src/main.js"]
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      TZ: America/Caracas
    depends_on:
      - db
      - redis
    restart: always

  api-admin:
    build: .
    container_name: api-admin
    command: ["node", "dist/admin/apps/admin/src/main.js"]
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DB_HOST: db
      TZ: America/Caracas
    depends_on:
      - db
      - redis
    restart: always

  api-businesses:
    build: .
    container_name: api-businesses
    command: ["node", "dist/businesses/apps/businesses/src/main.js"]
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      DB_HOST: db
      TZ: America/Caracas
    depends_on:
      - db
      - redis
    restart: always

  api-background-processes:
    build: .
    container_name: api-background-processes
    command:
      ["node", "dist/background-processes/apps/background-processes/src/main.js"]
    ports:
      - "3003:3003"
    env_file:
      - .env
    environment:
      DB_HOST: db
      TZ: America/Caracas
    depends_on:
      - db
      - redis
    restart: always

  migrate:
    build: .
    # Avoid `pnpm` here: the node image entrypoint prepends `node` when `pnpm`
    # is missing from PATH, which becomes `node /app/pnpm` and crashes.
    command:
      [
        "node",
        "-r",
        "ts-node/register",
        "-r",
        "tsconfig-paths/register",
        "./node_modules/typeorm/cli.js",
        "migration:run",
        "-d",
        "./data-source.ts",
      ]
    env_file:
      - .env
    environment:
      DB_HOST: db
      TZ: America/Caracas
    depends_on:
      - db

volumes:
  pgdata:
  redis_data:
