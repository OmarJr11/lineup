services:
  test-db:
    image: postgres:18-alpine
    container_name: lineup-test-db
    environment:
      POSTGRES_DB: lineup_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d lineup_test"]
      interval: 5s
      timeout: 3s
      retries: 5

  test-redis:
    image: redis:8-alpine
    container_name: lineup-test-redis
    ports:
      - "6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
